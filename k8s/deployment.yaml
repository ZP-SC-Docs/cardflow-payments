apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardflow
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cardflow
  template:
    metadata:
      labels:
        app: cardflow
    spec:
      hostNetwork: true
      containers:
        - name: cardflow
          image: registry.kessik.internal/cardflow:latest
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
          env:
            - name: DATABASE_URL
              value: postgresql://cardflow:Pa55w0rd-cardflow-prod@db.cardflow.internal:5432/cardflow
            - name: JWT_SECRET
              value: cardflow-jwt-signing-key-2025
          ports:
            - containerPort: 8000
